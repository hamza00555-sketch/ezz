<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#0D0F12"/>
  <!-- Radial glow top-right -->
  <radialGradient id="g1" cx="75%" cy="15%" r="40%">
    <stop offset="0%" stop-color="#A3B18A" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#A3B18A" stop-opacity="0"/>
  </radialGradient>
  <rect width="512" height="512" rx="112" fill="url(#g1)"/>
  <!-- Radial glow bottom-left -->
  <radialGradient id="g2" cx="12%" cy="82%" r="35%">
    <stop offset="0%" stop-color="#B08D57" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#B08D57" stop-opacity="0"/>
  </radialGradient>
  <rect width="512" height="512" rx="112" fill="url(#g2)"/>
  <!-- House shape -->
  <g transform="translate(256,256)">
    <!-- Roof -->
    <polygon points="0,-105 -90,-30 90,-30" fill="#A3B18A" opacity="0.9"/>
    <!-- Walls -->
    <rect x="-72" y="-30" width="144" height="108" rx="8" fill="#C7E77B" opacity="0.15"/>
    <rect x="-72" y="-30" width="144" height="108" rx="8" fill="none" stroke="#A3B18A" stroke-width="3" opacity="0.6"/>
    <!-- Door -->
    <rect x="-22" y="20" width="44" height="58" rx="22" fill="#B08D57" opacity="0.7"/>
    <!-- Windows -->
    <rect x="-58" y="-10" width="28" height="24" rx="6" fill="#A3B18A" opacity="0.4"/>
    <rect x="30" y="-10" width="28" height="24" rx="6" fill="#A3B18A" opacity="0.4"/>
  </g>
  <!-- Arabic عز text hint — decorative dots -->
  <circle cx="256" cy="174" r="6" fill="#C7E77B" opacity="0.8"/>
</svg>
